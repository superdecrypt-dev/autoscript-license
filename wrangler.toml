name = "autoscript-license"
main = "worker/src/index.js"
compatibility_date = "2026-03-31"
workers_dev = true

[vars]
# Built-in autoscript client now points to:
# https://autoscript.temp10sgt.workers.dev/api/v1/license/check
CACHE_TTL_SEC_DEFAULT = "3600"
PUBLIC_LICENSE_DURATION_DAYS = "14"
PUBLIC_UI_ORIGIN = "https://autoscript-2ed.pages.dev"
PUBLIC_CREATE_LIMIT_MAX = "5"
PUBLIC_CREATE_WINDOW_SEC = "900"
PUBLIC_STATUS_LIMIT_MAX = "30"
PUBLIC_STATUS_WINDOW_SEC = "900"
PUBLIC_RENEW_LIMIT_MAX = "10"
PUBLIC_RENEW_WINDOW_SEC = "900"
AUDIT_LOG_RETENTION_DAYS = "30"
PUBLIC_RATE_LIMIT_RETENTION_DAYS = "7"

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "LICENSE_DB"
database_name = "autoscript-license"
database_id = "d617a4b2-cf48-4f73-b3c8-4b0e04d274c0"
migrations_dir = "migrations"
