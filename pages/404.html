<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", monospace;
        background: #17120f;
        color: #f2e8dd;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        color: #c8b7a4;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Resource not found.</p>
    </main>
  </body>
</html>
